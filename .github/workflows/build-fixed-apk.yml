name: Build fixed APK

on:
  push:
    branches: ['fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
      - name: Run JVM regression tests and build signed debug APK
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK signature and record build identity
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RotationControl-fold-rotation-lock.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs dist/*.apk > dist/signature.txt
          git rev-parse HEAD > dist/commit.txt
          sha256sum dist/*.apk > dist/SHA256SUMS
          echo 'Build and JVM routing tests only; no physical-device gesture verification.' > dist/VALIDATION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RotationControl-fold-rotation-lock
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
